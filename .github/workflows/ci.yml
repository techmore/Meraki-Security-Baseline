name: CI

on:
  push:
    branches: [main, Meraki-Security-Baseline]
  pull_request:
    branches: [main, Meraki-Security-Baseline]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint and syntax check
        run: |
          ruff check .
          python -m py_compile meraki_backup.py
          python -m py_compile report_generator.py
          python -m py_compile meraki_env.py
          python -m py_compile meraki_query.py
          for f in reporting/*.py; do python -m py_compile "$f"; done

      - name: Smoke imports
        run: |
          python - <<'PY'
          import meraki_backup
          import meraki_env
          import meraki_query
          from reporting.app import build_org_report
          print("smoke imports ok")
          PY

      - name: Run tests
        run: |
          python -m coverage run --source=meraki_backup,meraki_client,meraki_env,merge_recommendations,ollama_review,reporting -m pytest tests/ -q --tb=short
          python -m coverage report --fail-under=50

      - name: Fixture report smoke test
        run: |
          python - <<'PY'
          from reporting.app import build_org_report
          from reporting.html_shell import build_html

          body = build_org_report("tests/fixtures", "CI Fixture Org")
          html = build_html("CI Fixture Org - Network Health Report", body)
          assert len(html) > 1000
          assert "executive-summary" in html
          assert "Traceback" not in html
          print("fixture report smoke test ok")
          PY

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt --progress-spinner off
